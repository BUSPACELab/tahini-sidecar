name: Build Enclave

# Compiles the SGX halves of the sidecar: the untrusted launcher, the generated
# EDL bridge, and the signed enclave.
#
# This code had no CI at all. e_sidecar.c, u_main.c and sidecar.edl were built
# only when someone ran Bazel on a machine with the SGX SDK, which meant a typo
# in the enclave surfaced on a provisioned confidential VM rather than on a pull
# request. Compiling is cheap; finding out later is not.
#
# Built with SGX_MODE=HW, which is what Azure deploys, so CI checks the same
# configuration rather than a near neighbour. HW mode also links libsgx_urts from
# the distribution packages; SIM links libsgx_urts_sim, which in SDK 2.27 carries
# a dangling reference to libsgx_uae_service_sim and fails to link at all.
#
# A runner has no SGX hardware, so this proves the code compiles, links and that
# the enclave signs. It cannot prove attestation works — enclave creation and
# quote generation both need real SGX, and that is only testable on a
# confidential VM.

on:
  push:
    branches: [main]
    paths:
      - "e_sidecar.c"
      - "u_main.c"
      - "u_util.c"
      - "u_util.h"
      - "sidecar.h"
      - "sidecar.edl"
      - "sidecar.lds"
      - "sidecar.config.xml"
      - "BUILD"
      - "MODULE.bazel"
      - ".github/workflows/build-enclave.yml"
  pull_request:
    paths:
      - "e_sidecar.c"
      - "u_main.c"
      - "u_util.c"
      - "u_util.h"
      - "sidecar.h"
      - "sidecar.edl"
      - "sidecar.lds"
      - "sidecar.config.xml"
      - "BUILD"
      - "MODULE.bazel"
      - ".github/workflows/build-enclave.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build sidecar + enclave (SGX_MODE=HW)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The nested fizz-rs submodule is not needed: neither sidecar_bin nor
          # enclave_signed depends on it, and skipping it avoids a large clone.
          submodules: false

      - name: Install Bazelisk
        run: |
          sudo wget -qO /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      # The DCAP headers and libraries are needed even in SIM, because
      # sidecar_bin links libsgx_dcap_ql for quote generation regardless of mode.
      - name: Install SGX runtime and DCAP
        run: |
          set -euo pipefail
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.01.org/intel-sgx/sgx_repo/ubuntu/intel-sgx-deb.key \
            | sudo tee /etc/apt/keyrings/intel-sgx.asc >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/intel-sgx.asc] https://download.01.org/intel-sgx/sgx_repo/ubuntu jammy main' \
            | sudo tee /etc/apt/sources.list.d/intel-sgx.list
          sudo apt-get update
          sudo apt-get install -y \
            libsgx-enclave-common libsgx-urts libsgx-quote-ex \
            libsgx-dcap-ql libsgx-dcap-ql-dev libsgx-enclave-common-dev

      # Version pinned to match the Dockerfile so CI and the image compile
      # against the same SDK.
      - name: Install SGX SDK 2.27
        run: |
          set -euo pipefail
          wget -q https://download.01.org/intel-sgx/sgx-linux/2.27/distro/ubuntu22.04-server/sgx_linux_x64_sdk_2.27.100.1.bin
          chmod +x sgx_linux_x64_sdk_2.27.100.1.bin
          # sudo because /opt is root-owned on a runner; the Dockerfile gets away
          # without it by running as root.
          sudo ./sgx_linux_x64_sdk_2.27.100.1.bin --prefix /opt/intel
          rm -f sgx_linux_x64_sdk_2.27.100.1.bin

      # Signing with a fixed key so MRSIGNER is stable and a verifier can pin it.
      # Without this the build generates a key per run: two builds of the same
      # commit were measured producing identical MRENCLAVE and different MRSIGNER.
      #
      # Secrets are not exposed to workflows from forked pull requests, so a public
      # repo does not hand this to arbitrary contributors. It is still a trust
      # anchor held in CI, which is appropriate for a research artifact and not for
      # something production relies on — that wants an HSM and two-step signing,
      # where the private key never reaches the build at all.
      # The emptiness check is inside the step rather than in `if:`, because the
      # secrets context is not available to a step-level condition — and neither is
      # a step's own env, which is the other obvious guess.
      - name: Provide the enclave signing key
        env:
          SIGNING_KEY: ${{ secrets.SIDECAR_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::SIDECAR_SIGNING_KEY is not set; a throwaway key will be generated and MRSIGNER will differ from released builds"
            exit 0
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/sidecar_signing.pem"
          openssl rsa -in "$RUNNER_TEMP/sidecar_signing.pem" -noout -check >/dev/null
          echo "TAHINI_SIGNING_KEY=$RUNNER_TEMP/sidecar_signing.pem" >> "$GITHUB_ENV"

      - name: Build the untrusted launcher and the signed enclave
        run: |
          set -eo pipefail
          # Intel's environment script reads PKG_CONFIG_PATH without a default, so
          # sourcing it under `set -u` aborts with "unbound variable".
          source /opt/intel/sgxsdk/environment
          set -u
          if [ -n "${TAHINI_SIGNING_KEY:-}" ]; then
            echo "signing with the fixed key; MRSIGNER will be stable"
          else
            echo "::warning::no SIDECAR_SIGNING_KEY available; MRSIGNER will differ from released builds"
          fi
          SGX_MODE=HW bazel build //:sidecar_bin //:enclave_signed //examples:hello

      - name: Show what was produced
        run: |
          set -euo pipefail
          ls -lh bazel-bin/sidecar bazel-bin/enclave.signed.so
          file bazel-bin/sidecar bazel-bin/enclave.signed.so

      # The launcher checks its caller is in sidecar-owners before touching the
      # enclave, so this reaches either that check or the enclave creation that
      # needs hardware. Both prove it linked and starts.
      - name: Check the launcher starts
        run: |
          set -eo pipefail
          source /opt/intel/sgxsdk/environment
          set -u
          out="$(./bazel-bin/sidecar /bin/true 2>&1 || true)"
          echo "$out"
          if grep -qiE "permission denied|group sidecar-owners" <<<"$out"; then
            echo "launcher started and enforced its group check, as expected"
          elif grep -qiE "failed to create enclave|sgx_qe_get_target_info|get_enclave_quote" <<<"$out"; then
            echo "launcher started and reached the SGX path; SIM cannot go further"
          else
            echo "unexpected output from the launcher" >&2
            exit 1
          fi

      # Publishing these removes the need to build on the deployment hosts, which
      # was slow on a 1 vCPU confidential VM and — on one of ours — impossible,
      # because bazel there hangs with no output at all. It also gives every tier
      # the same enclave, so a verifier pins one measurement rather than one per
      # machine that happened to build successfully.
      - name: Package the launcher and enclave
        run: |
          set -euo pipefail
          mkdir -p sidecar-dist
          cp bazel-bin/sidecar bazel-bin/enclave.signed.so sidecar-dist/
          chmod +x sidecar-dist/sidecar
          sha256sum sidecar-dist/* | tee sidecar-dist/SHA256SUMS

          # The enclave's identities, recorded so a verifier can pin them without
          # re-deriving them from the binary. MRENCLAVE is the code measurement and
          # is reproducible across builds of the same commit; MRSIGNER identifies
          # the key, and is stable only when one was supplied above.
          source /opt/intel/sgxsdk/environment
          sgx_sign dump -enclave sidecar-dist/enclave.signed.so \
            -dumpfile "$RUNNER_TEMP/enclave-dump.txt" >/dev/null
          mrenclave="$(awk '/enclave_hash.m/{found=1; next} found && /0x/{gsub(/[^0-9a-fx ]/,""); for(i=1;i<=NF;i++){gsub(/0x/,"",$i); printf "%s",$i}; if(++n==2) exit}' "$RUNNER_TEMP/enclave-dump.txt")"
          {
            echo "commit    ${{ github.sha }}"
            echo "mrenclave ${mrenclave:-unknown}"
            if [ -n "${TAHINI_SIGNING_KEY:-}" ]; then
              echo "mrsigner  $(openssl rsa -in "$TAHINI_SIGNING_KEY" -noout -modulus \
                | cut -d= -f2 \
                | python3 -c 'import sys,hashlib; print(hashlib.sha256(bytes.fromhex(sys.stdin.read().strip())[::-1]).hexdigest())')"
            else
              echo "mrsigner  UNSTABLE (no signing key supplied; differs every build)"
            fi
          } | tee sidecar-dist/MEASUREMENTS

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-enclave
          path: sidecar-dist/
          retention-days: 5
